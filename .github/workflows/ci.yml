name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ADR gate runs first, offline, no token: an unruled high-risk
      # decision (proposed OR proposed-implemented) cannot ride a merge.
      - name: ADR approval gate
        run: bash scripts/adr.sh check

      # Until the project scaffold lands (first rung), there is nothing to
      # build — the job passes so `check` can be a required check from day 0.
      - id: guard
        run: |
          if [ -f "package.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — nothing to typecheck or test."
          fi

      
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.guard.outputs.ready == 'true'
        run: npx tsc --noEmit

      - name: Test
        if: steps.guard.outputs.ready == 'true'
        run: npm test
